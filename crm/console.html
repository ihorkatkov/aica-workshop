<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="__CSRF__"><title>Deals · AICA CRM</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#181818;background:#eef1f6;font-size:14px;--line:#d8dde6;--blue:#0176d3;--muted:#5c6674}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a{touch-action:manipulation}button{border:1px solid #b8c1cd;background:#fff;border-radius:4px;padding:8px 14px;color:#075da8;cursor:pointer;font-weight:600}button:hover{background:#f0f7ff}button:disabled{opacity:.5;cursor:wait}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #1b96ff;outline-offset:3px}[hidden]{display:none!important}.primary{background:var(--blue);border-color:var(--blue);color:white}.primary:hover{background:#025ba5}header{background:#fff;border-top:4px solid var(--blue);box-shadow:0 1px 3px #152b4420} .appbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 28px}.brand{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;color:#16325c}.brand-icon{display:grid;place-items:center;width:34px;height:34px;background:#0176d3;color:#fff;border-radius:8px;font-size:14px}.tools{display:flex;gap:22px}.tools a{color:#526174;text-decoration:none;font-size:13px}.tools a:hover{text-decoration:underline}.objectnav{border-top:1px solid #edf0f4;padding:0 28px;display:flex;align-items:center;gap:28px}.objectnav span{font-size:13px;color:var(--muted)}.objectnav button{border:0;border-bottom:3px solid var(--blue);border-radius:0;padding:12px 20px;color:#16325c;background:#edf5fc}main{max-width:1600px;margin:auto;padding:24px 28px}h1{font-size:24px;line-height:1.25;margin:4px 0 0;color:#16325c}h2{font-size:18px;margin:0;color:#16325c}h3{font-size:15px;margin:0}p{line-height:1.6}.panel{background:#fff;border:1px solid var(--line);border-radius:7px;overflow:hidden;box-shadow:0 2px 3px #16325c06}.panel-head{padding:22px 24px 16px;display:flex;justify-content:space-between;gap:16px;align-items:center}.eyebrow{font-size:12px;color:var(--muted);margin:0}.sub{font-size:12px;color:var(--muted);margin:7px 0 0}.toolbar{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:0 24px 18px}.filters{display:flex;gap:10px;min-width:50%}input,select{min-width:0;padding:9px 12px;border:1px solid #b8c1cd;border-radius:4px;background:white;color:inherit}input{flex:1;width:100%}.summary{display:flex;gap:18px;font-size:12px;color:var(--muted);flex-wrap:wrap}.summary strong{color:#263a53;font-variant-numeric:tabular-nums}.table-scroll{overflow:auto;max-height:calc(100vh - 315px);min-height:180px}table{border-collapse:collapse;width:100%;text-align:left;white-space:nowrap}caption{text-align:left}th{position:sticky;top:0;background:#f7f9fb;border-block:1px solid var(--line);font-size:12px;color:#485568;font-weight:600;z-index:1}th button{border:0;border-radius:0;background:transparent;color:inherit;padding:13px 18px;width:100%;text-align:left;font-size:12px}td{padding:14px 18px;border-bottom:1px solid #e8ecf1;font-size:13px}tbody tr:hover{background:#f5f9fe}tbody tr:last-child td{border-bottom:0}.record-link{padding:0;border:0;background:none;text-align:left;font-weight:600;color:#016bc1}.record-link:hover{text-decoration:underline;background:none}.record-id{font-size:11px;color:var(--muted);margin-top:5px}.badge{display:inline-block;border-radius:4px;padding:4px 8px;font-size:11px;font-weight:600;white-space:nowrap;background:#edf1f6;color:#45566b}.badge.cleared,.badge.applied{background:#e4f3eb;color:#226744}.badge.open,.badge.pending{background:#fff2d5;color:#775313}.badge.expired,.badge.stale,.badge.missing{background:#fbeae7;color:#9e352e}.badge.approved{background:#e7effc;color:#285b9b}.back{margin:0 0 14px;padding:0;border:0;background:transparent;font-size:13px}.record-head{padding:24px;border-bottom:1px solid var(--line);background:#fafbfd}.record-title{display:flex;gap:14px;align-items:start}.record-icon{background:#ff9855;color:#fff;border-radius:6px;padding:9px;font-size:20px}.highlights{display:flex;gap:40px;flex-wrap:wrap;margin:24px 0 0}.highlights dt,.facts dt{color:var(--muted);font-size:12px;margin-bottom:7px}.highlights dd,.facts dd{margin:0;font-size:14px}.highlights dd{font-weight:600}.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);padding:0 24px}.tabs button{border:0;border-radius:0;border-bottom:3px solid transparent;color:#566375;padding:17px 0 13px;font-weight:400}.tabs button[aria-selected=true]{border-color:var(--blue);color:#075da8;font-weight:700}.tab-content{padding:24px;max-width:1000px;min-height:320px}.section-heading{background:#f3f5f8;padding:11px 14px;font-size:13px;border-radius:3px}.facts{display:grid;grid-template-columns:1fr 1fr;column-gap:40px;margin:4px 0 24px}.facts>div{padding:17px 4px;border-bottom:1px solid #e6eaf0}.note{font-size:14px;margin:0;padding:16px 4px;line-height:1.65}.requests{margin-bottom:28px}.requests>h2{margin-bottom:14px}.proposal{border:1px solid var(--line);border-radius:5px;padding:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:20px}.proposal .explain{margin:5px 0 0}.proposal .actions{flex-shrink:0}.proposal h3{display:flex;justify-content:space-between;gap:12px}.change{margin:16px 0;line-height:1.7;background:#f7f9fb;padding:12px;font-size:13px}.actions{display:flex;gap:10px}.explain,.empty{color:var(--muted);font-size:13px;line-height:1.6}.empty{padding:26px}.event{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid #edf0f4;line-height:1.6;font-size:14px}.event-marker{border-radius:4px;background:#edf4fc;padding:3px 7px;font-size:11px;color:#53677f;align-self:start;min-width:40px;text-align:center}.event small{color:var(--muted)}footer{display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:11px;margin-top:18px}#notice{display:none;background:#eaf5ed;border:1px solid #bbdcc5;border-radius:5px;padding:12px 18px;margin-bottom:16px;line-height:1.5}#notice:not(:empty){display:block}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.pending-marker{display:inline-block;margin-left:8px;color:#075da8;font-size:11px;font-weight:600}#notice.error{background:#fff0eb;border-color:#e7bca9}@media(max-width:700px){.appbar{padding:12px 16px;align-items:start;flex-direction:column;gap:12px}.objectnav{padding:0 16px}main{padding:16px 12px}.panel-head{padding:18px 16px}.toolbar{padding:0 16px 16px;align-items:stretch;flex-direction:column}.filters{flex-direction:column}.summary{gap:12px}.table-scroll{max-height:55vh}td:first-child,th:first-child{position:sticky;left:0;background:#fff;z-index:1;box-shadow:1px 0 0 var(--line)}th:first-child{z-index:2;background:#f7f9fb}td:first-child{max-width:190px;white-space:normal;min-width:160px}.record-link{line-height:1.4}.record-head{padding:18px 16px}.record-title{display:grid;grid-template-columns:36px minmax(0,1fr)}.record-title>div{min-width:0}.record-title>button{grid-column:2;justify-self:start;margin-left:0!important}.record-icon{padding:8px;font-size:18px}.record-title h1{overflow-wrap:anywhere}.highlights{gap:20px}.tabs{padding:0 16px;gap:24px}.tab-content{padding:18px 16px}.facts{grid-template-columns:1fr}h1{font-size:21px}footer{flex-direction:column;gap:7px}.tools{gap:20px}.proposal{align-items:start;flex-direction:column}}
</style></head><body>
<header><div class="appbar"><div class="brand"><span class="brand-icon" aria-hidden="true">A</span>AICA CRM</div><nav class="tools" aria-label="Workshop tools"><a href="http://localhost:8000" target="_blank" rel="noopener">Chat with agent ↗</a><a href="http://localhost:5560/aica-lab/traces" target="_blank" rel="noopener">View traces ↗</a></nav></div><nav class="objectnav" aria-label="CRM navigation"><span>Sales workspace</span><button id="nav-deals" aria-current="page">Deals</button></nav></header>
<main><div id="notice" tabindex="-1" role="status" aria-live="polite"></div>
<section class="panel" id="list-view" aria-label="Deals list"><div class="panel-head"><div><p class="eyebrow">Deals</p><h1>Customer pilots</h1><p class="sub" id="result-count"></p></div><button id="refresh">Refresh</button></div><div class="toolbar"><div class="summary" aria-label="CRM overview"><span><strong id="deal-count">—</strong> deals</span><span><strong id="kickoff-count">—</strong> kickoffs</span><span><strong id="review-count">—</strong> review requests</span></div><div class="filters"><input id="search" type="search" aria-label="Search deals" placeholder="Search company, site, or deal ID"><select id="filter" aria-label="Filter deals"><option value="all">All reviews</option><option value="cleared">Review: cleared</option><option value="open">Review: open</option><option value="missing">Review: missing</option><option value="expired">Review: expired</option></select></div></div><div id="deals" class="table-scroll" tabindex="0" role="region" aria-label="Scrollable deals table"><p class="empty">Loading deals…</p></div></section>
<section id="record-view" hidden aria-label="Deal record"><button class="back" id="back">← All deals</button><div class="panel" id="detail"></div></section>
<footer><span>Local workshop · synthetic data only · <span id="business-date"></span></span><span id="updated">Connecting to CRM…</span></footer></main>
<script>
const csrf=document.querySelector('meta[name="csrf-token"]').content;
let data=null,selected=null,busy=false,recordOpen=false,activeTab='details',sortKey='id',sortDirection=1;
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label=action=>action==='schedule_kickoff'?'Schedule kickoff':'Request review update';
const badge=status=>`<span class="badge ${esc(status)}">${esc(status.replaceAll('_',' '))}</span>`;
function notice(text,error=false){$('notice').textContent=text;$('notice').classList.toggle('error',error)}
async function api(path,body){const response=await fetch('/ui/'+path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:body===undefined?undefined:JSON.stringify(body)});const result=await response.json();if(!response.ok)throw new Error(typeof result.detail==='string'?result.detail:'The CRM could not complete this request.');return result}
async function refresh(){try{data=await api('state');render();$('updated').textContent='Updated '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});}catch(e){notice(e.message,true);if(!data)$('deals').innerHTML='<p class="empty">Unable to load deals. Use Refresh to try again.</p>'}}
function pending(id){return data.proposals.filter(p=>p.deal_id===id&&['pending','approved'].includes(p.status)).length}
function sortedDeals(deals){
 return [...deals].sort((a,b)=>String(sortValue(a,sortKey)).localeCompare(String(sortValue(b,sortKey)),undefined,{numeric:true})*sortDirection);
}
function sortValue(d,key){return key==='company'?parts(d)[0]:key==='site'?parts(d)[1]:d[key]??''}
function parts(d){const [company,...site]=d.title.split(' / ');return [company,site.join(' / ')||'—']}
function openList(){recordOpen=false;notice('');render()}
function render(){
 $('deal-count').textContent=data.deals.length;
 $('kickoff-count').textContent=data.deals.reduce((n,d)=>n+d.kickoffs,0);
 $('review-count').textContent=data.deals.reduce((n,d)=>n+d.review_requests,0);
 $('business-date').textContent=data.deals[0]?.as_of?'Record date '+data.deals[0].as_of:'';
 const q=$('search').value.toLowerCase(),filter=$('filter').value;
 const deals=sortedDeals(data.deals.filter(d=>(d.title+' '+d.id).toLowerCase().includes(q)&&(filter==='all'||d.security_review===filter)));
 if(!recordOpen&&!deals.some(d=>d.id===selected))selected=deals[0]?.id||null;
 $('result-count').textContent=deals.length+' of '+data.deals.length+' records';
 const columns=[['company','Company'],['site','Site'],['stage','Stage'],['security_review','Security review'],['review_valid_until','Valid through'],['kickoffs','Kickoffs'],['review_requests','Review requests']];
 $('deals').innerHTML=deals.length?`<table><caption class="sr-only">Customer pilot deals</caption><thead><tr>${columns.map(([key,title])=>`<th scope="col" aria-sort="${sortKey===key?(sortDirection===1?'ascending':'descending'):'none'}"><button data-sort="${key}">${title}${sortKey===key?(sortDirection===1?' ↑':' ↓'):''}</button></th>`).join('')}</tr></thead><tbody>${deals.map(d=>`<tr><td><button class="record-link" data-deal="${esc(d.id)}" aria-label="Open ${esc(d.title)}, ${esc(d.id)}">${esc(parts(d)[0])}</button><div class="record-id">${esc(d.id)}${pending(d.id)?`<span class="pending-marker">${pending(d.id)} awaiting action</span>`:''}</div></td><td>${esc(parts(d)[1])}</td><td>${esc(stage(d.stage))}</td><td>${badge(d.security_review)}</td><td>${esc(d.review_valid_until||'—')}</td><td>${d.kickoffs}</td><td>${d.review_requests}</td></tr>`).join('')}</tbody></table>`:'<p class="empty">No deals match this filter.</p>';
 document.querySelectorAll('[data-sort]').forEach(el=>el.onclick=()=>{sortDirection=sortKey===el.dataset.sort?-sortDirection:1;sortKey=el.dataset.sort;render();document.querySelector(`[data-sort="${sortKey}"]`).focus()});
 document.querySelectorAll('[data-deal]').forEach(el=>el.onclick=()=>{selected=el.dataset.deal;recordOpen=true;activeTab='details';notice('');render();$('record-title').focus()});
 $('list-view').hidden=recordOpen;$('record-view').hidden=!recordOpen;
 const d=data.deals.find(d=>d.id===selected);
 if(!d){$('detail').innerHTML='<p class="empty">No deal selected. Try another search or filter.</p>';return}
 const proposals=data.proposals.filter(p=>p.deal_id===d.id);
 const requests=proposals.filter(p=>['pending','approved'].includes(p.status));
 const events=data.audit.filter(e=>e.detail.deal_id===d.id||proposals.some(p=>p.id===e.detail.proposal_id)).slice().reverse();
 if(activeTab==='proposals')activeTab='activity';
 const tabs=[['details','Details'],['activity','Activity'+(requests.length?' ('+requests.length+')':'')]];
 $('detail').innerHTML=`<div class="record-head"><div class="record-title"><span class="record-icon" aria-hidden="true">▣</span><div><p class="eyebrow">Deal · ${esc(d.id)}</p><h1 id="record-title" tabindex="-1">${esc(d.title)}</h1></div><button id="record-refresh" style="margin-left:auto">Refresh</button></div><dl class="highlights"><div><dt>Stage</dt><dd>${esc(stage(d.stage))}</dd></div><div><dt>Security review</dt><dd>${badge(d.security_review)}</dd></div><div><dt>Kickoff meetings</dt><dd>${d.kickoffs}</dd></div><div><dt>Review requests</dt><dd>${d.review_requests}</dd></div></dl></div><div class="tabs" role="tablist" aria-label="Deal sections">${tabs.map(([id,title])=>`<button role="tab" id="tab-${id}" data-tab="${id}" aria-selected="${activeTab===id}" aria-controls="panel-${id}" tabindex="${activeTab===id?0:-1}">${title}</button>`).join('')}</div><section class="tab-content" id="panel-details" role="tabpanel" aria-labelledby="tab-details" ${activeTab!=='details'?'hidden':''}><h2 class="section-heading">Deal information</h2><dl class="facts"><div><dt>Company</dt><dd>${esc(parts(d)[0])}</dd></div><div><dt>Site</dt><dd>${esc(parts(d)[1])}</dd></div><div><dt>Deal ID</dt><dd>${esc(d.id)}</dd></div><div><dt>Stage</dt><dd>${esc(stage(d.stage))}</dd></div><div><dt>Security review</dt><dd>${badge(d.security_review)}</dd></div><div><dt>Review valid through</dt><dd>${esc(d.review_valid_until||'Not recorded')}</dd></div></dl><h2 class="section-heading">Notes</h2><p class="note">${esc(typeof d.notes==='string'?d.notes:JSON.stringify(d.notes))}</p></section><section class="tab-content" id="panel-activity" role="tabpanel" aria-labelledby="tab-activity" ${activeTab!=='activity'?'hidden':''}>${requests.length?`<section class="requests" aria-label="Pending requests"><h2>Pending requests</h2>${requests.map(p=>proposal(p,d)).join('')}</section>`:''}<h2>Activity history</h2><p class="sub">Newest first</p>${events.length?events.map(e=>`<div class="event"><span class="event-marker" aria-hidden="true">${e.event==='unsafe_write'||e.event==='promoted'?'✓':'•'}</span><div><strong>${esc(eventLabel(e,proposals))}</strong><br><small>${esc(eventDetail(e,proposals))}</small></div></div>`).join(''):'<p class="empty">No activity recorded.</p>'}</section>`;
 $('record-refresh').onclick=refresh;
 function selectTab(id){activeTab=id;render();$('tab-'+id).focus()}
 document.querySelectorAll('[data-tab]').forEach((el,index)=>{el.onclick=()=>selectTab(el.dataset.tab);el.onkeydown=e=>{let next;if(e.key==='ArrowRight')next=(index+1)%tabs.length;if(e.key==='ArrowLeft')next=(index+tabs.length-1)%tabs.length;if(e.key==='Home')next=0;if(e.key==='End')next=tabs.length-1;if(next!==undefined){e.preventDefault();selectTab(tabs[next][0])}}});
 document.querySelectorAll('[data-action]').forEach(el=>{el.disabled=busy;el.onclick=()=>act(`proposals/${el.dataset.pid}/${el.dataset.action}`)});
}
function stage(value){return value?value.replaceAll('_',' ').replace(/^./,c=>c.toUpperCase()):'Not recorded'}
function proposal(p,d){
 if(!['pending','approved'].includes(p.status))return '';
 const kickoff=p.action==='schedule_kickoff';
 return `<article class="proposal"><div><h3>${kickoff?'Schedule a kickoff meeting':'Request a security review'}</h3><p class="explain">${p.status==='pending'?'Awaiting approval':'Approved · ready to complete'}</p></div><div class="actions">${p.status==='pending'?`<button class="primary" data-action="approve" data-pid="${esc(p.id)}">Approve</button>`:`<button class="primary" data-action="promote" data-pid="${esc(p.id)}">${kickoff?'Schedule kickoff':'Request review'}</button>`}</div></article>`;
}
function eventLabel(e,proposals){
 const action=e.detail.action||proposals.find(p=>p.id===e.detail.proposal_id)?.action;
 const subject=action==='schedule_kickoff'?'Kickoff':'Security review';
 if(e.event==='unsafe_write'||e.event==='promoted'&&e.detail.changed)return action==='schedule_kickoff'?'Kickoff scheduled':'Security review requested';
 return {rejected:subject+' request declined',proposed:subject+' request created',approved:subject+' request approved',promoted:'No change recorded',stale:subject+' request no longer current',review_changed:'Security review updated'}[e.event]||stage(e.event);
}
function eventDetail(e,proposals){
 const p=proposals.find(p=>p.id===e.detail.proposal_id);
 const action=e.detail.action||p?.action;
 const actor=e.event==='unsafe_write'||e.event==='proposed'?'Agent':e.event==='approved'||e.event==='promoted'?'User':'CRM';
 return [actor,e.detail.status?stage(e.detail.status):'',e.detail.message||''].filter(Boolean).join(' · ');
}
async function act(path,body={}){if(busy)return;busy=true;render();try{const result=await api(path,body);const messages={NOT_APPROVED:'This request is awaiting approval.',STALE_STATE:'The deal has changed. This request is no longer current.',approved:'Request approved.',applied:'CRM updated.',already_applied:'This change has already been applied.',no_change:'No change recorded.'};notice(messages[result.code]||messages[result.status]||result.message||'Request completed.',result.status==='rejected');await refresh()}catch(e){notice(e.message,true)}finally{busy=false;render();$('notice').focus()}}
$('back').onclick=()=>{openList();$('search').focus()};$('nav-deals').onclick=openList;$('refresh').onclick=refresh;$('search').oninput=()=>data&&render();$('filter').onchange=()=>data&&render();refresh();
</script></body></html>
